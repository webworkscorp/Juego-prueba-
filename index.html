<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Hello Neighbor Kitchen Epic Replica</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #click-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            background: rgba(18, 25, 45, 0.95);
            padding: 20px 40px;
            border-radius: 12px;
            border: 3px solid #ff9933;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            z-index: 15;
            box-shadow: 0 12px 30px rgba(0,0,0,0.9);
            transition: all 0.2s ease;
        }
        #click-prompt:hover {
            background: rgba(30, 42, 75, 0.95);
            transform: translate(-50%, -52%);
        }

        /* Controles Móviles */
        #mobile-controls {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 153, 51, 0.6);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        #joystick-knob {
            width: 45px;
            height: 45px;
            background: rgba(255, 153, 51, 0.85);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }
        #touch-camera-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 65%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
        }
        #door-prompt {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            background: rgba(15, 15, 15, 0.9);
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 15px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 30;
            display: none;
            align-items: center;
            gap: 8px;
            text-shadow: 1px 1px 2px black;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #door-prompt:hover {
            background: rgba(35, 35, 35, 0.95);
        }
        #flashlight-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 15, 0.7);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 24px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        #flashlight-btn:hover, #flashlight-btn:active {
            background: rgba(45, 45, 45, 0.9);
        }
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 26, 0.65) 90%, #00001a 100%);
        }
    </style>
</head>
<body>
    <div id="vignette"></div>
    <div id="canvas-container"></div>
    


    <div id="click-prompt">
        HACER CLICK PARA ENTRAR
    </div>

    <div id="crosshair"></div>
    <div id="door-prompt"></div>
    <div id="flashlight-btn">🔦</div>

    <div id="mobile-controls">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
        <div id="touch-camera-area"></div>
    </div>

    <!-- Carga de Three.js r128 clásico y Loaders Oficiales de la Comunidad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script>
        // --- INICIALIZACIÓN DE LA ESCENA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Niebla nocturna profunda y fría
        scene.fog = new THREE.FogExp2('#000208', 0.07);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(-2.8, 1.45, 2.6);
        scene.add(camera);

        const flashlight = new THREE.SpotLight(0xfffff0, 1.2, 35, Math.PI / 14, 0.8, 2.5);
        flashlight.position.set(0, -0.2, 0);
        camera.add(flashlight);
        camera.add(flashlight.target);
        flashlight.target.position.set(0, -0.2, -1);
        
        flashlight.castShadow = true;
        flashlight.shadow.mapSize.width = 2048;
        flashlight.shadow.mapSize.height = 2048;
        flashlight.shadow.camera.near = 0.2;
        flashlight.shadow.camera.far = 30;
        flashlight.shadow.bias = -0.0006;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Sombras suaves de alta calidad
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // Configuración de tono de color fotorrealista/cinemático
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        // --- SISTEMAS DE CONTROL ---
        const keys = { w: false, a: false, s: false, d: false };
        let isPointerLocked = false;
        let isMobile = false;

        // Ángulos iniciales para enfocar en diagonal
        let yaw = -0.58; 
        let pitch = -0.05; 

        const BOUNDS = {
            minX: -4.5,
            maxX: 4.5,
            minZ: -3.2,
            maxZ: 3.2
        };

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            isMobile = true;
            document.getElementById('mobile-controls').style.display = 'block';
            document.getElementById('click-prompt').style.display = 'none';
        }

        // --- GENERADOR DE TEXTURAS DE ALTA RESOLUCIÓN ---

        // 1. Textura del Suelo: Tablones de Madera Realistas con Mapa de Relieve (Bump Map)
        const createRealisticFloorTextures = () => {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = size;
            bumpCanvas.height = size;
            const bCtx = bumpCanvas.getContext('2d');

            const rows = 16;
            const rowHeight = size / rows;

            for (let r = 0; r < rows; r++) {
                const y = r * rowHeight;
                
                // Variación del color natural de la madera oscura entre tablones
                const rVal = 35 + Math.floor(Math.random() * 12);
                const gVal = 24 + Math.floor(Math.random() * 8);
                const bVal = 16 + Math.floor(Math.random() * 6);
                
                ctx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
                ctx.fillRect(0, y, size, rowHeight);

                // Gris base neutro para el mapa de relieve
                bCtx.fillStyle = '#808080';
                bCtx.fillRect(0, y, size, rowHeight);

                // Dibujar vetas orgánicas de la madera
                ctx.strokeStyle = `rgba(10, 5, 2, 0.25)`;
                for (let g = 0; g < 12; g++) {
                    ctx.beginPath();
                    ctx.lineWidth = 1 + Math.random() * 1.5;
                    let gy = y + Math.random() * rowHeight;
                    ctx.moveTo(0, gy);
                    for (let x = 0; x <= size; x += 40) {
                        gy += (Math.random() - 0.5) * 4;
                        ctx.lineTo(x, gy);
                    }
                    ctx.stroke();
                }

                // Dibujar un nudo de madera aleatorio
                if (Math.random() > 0.6) {
                    const kx = Math.random() * size;
                    const ky = y + Math.random() * rowHeight;
                    ctx.fillStyle = `rgba(8, 4, 1, 0.4)`;
                    ctx.beginPath();
                    ctx.ellipse(kx, ky, 15 + Math.random()*20, 4 + Math.random()*6, Math.random()*0.2, 0, Math.PI*2);
                    ctx.fill();
                }

                // Separación horizontal de los tablones
                ctx.fillStyle = '#0a0502';
                ctx.fillRect(0, y, size, 3);
                ctx.fillRect(0, y + rowHeight - 3, size, 3);

                bCtx.fillStyle = '#101010';
                bCtx.fillRect(0, y, size, 5);
                bCtx.fillRect(0, y + rowHeight - 5, size, 5);

                // Cortes de unión vertical desfasados
                const numCuts = 4;
                const cutWidth = size / numCuts;
                const offset = (r % 2) * (cutWidth / 2);
                for (let c = -1; c <= numCuts + 1; c++) {
                    const cx = c * cutWidth + offset;
                    if (cx >= 0 && cx <= size) {
                        ctx.fillStyle = '#0a0502';
                        ctx.fillRect(cx, y, 3, rowHeight);

                        bCtx.fillStyle = '#101010';
                        bCtx.fillRect(cx - 1, y, 5, rowHeight);
                    }
                }
            }

            // Añadir micro-poro y rugosidad
            const imgData = ctx.getImageData(0, 0, size, size);
            const bImgData = bCtx.getImageData(0, 0, size, size);
            const data = imgData.data;
            const bData = bImgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 10;
                data[i] = Math.max(0, Math.min(255, data[i] + noise));
                data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise * 0.8));
                data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise * 0.6));

                const bNoise = (Math.random() - 0.5) * 12;
                bData[i] = Math.max(0, Math.min(255, bData[i] + bNoise));
                bData[i+1] = bData[i];
                bData[i+2] = bData[i];
            }
            ctx.putImageData(imgData, 0, 0);
            bCtx.putImageData(bImgData, 0, 0);

            const diffuseTex = new THREE.CanvasTexture(canvas);
            const bumpTex = new THREE.CanvasTexture(bumpCanvas);
            
            diffuseTex.wrapS = THREE.RepeatWrapping;
            diffuseTex.wrapT = THREE.RepeatWrapping;
            bumpTex.wrapS = THREE.RepeatWrapping;
            bumpTex.wrapT = THREE.RepeatWrapping;

            return { diffuse: diffuseTex, bump: bumpTex };
        };

        const floorTextures = createRealisticFloorTextures();

        // --- CARGA DE TEXTURAS DE PARED Y TECHO ---
        const textureLoader = new THREE.TextureLoader();
        const wallUrl = "https://i.imgur.com/TzX40Xu.jpeg";
        const ceilingUrl = "https://i.imgur.com/EQbC2Lw.jpeg";
        
        const wallTexSides = textureLoader.load(wallUrl);
        wallTexSides.wrapS = THREE.RepeatWrapping;
        wallTexSides.wrapT = THREE.RepeatWrapping;
        wallTexSides.repeat.set(4.5, 1.5);

        const wallTexFB = textureLoader.load(wallUrl);
        wallTexFB.wrapS = THREE.RepeatWrapping;
        wallTexFB.wrapT = THREE.RepeatWrapping;
        wallTexFB.repeat.set(3.2, 1.5);

        // Carga de la textura exacta para el techo
        const ceilingTex = textureLoader.load(ceilingUrl);
        ceilingTex.wrapS = THREE.RepeatWrapping;
        ceilingTex.wrapT = THREE.RepeatWrapping;
        ceilingTex.repeat.set(4, 3);

        // Vetas de madera de los gabinetes
        const cabinetTex = (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#835736';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#54361e';
            ctx.lineWidth = 1.5;
            for (let y = 8; y < canvas.height; y += 16) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x <= canvas.width; x += 10) {
                    const wave = Math.sin(x * 0.08 + y) * 3;
                    ctx.lineTo(x, y + wave);
                }
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        })();

        // --- CONFIGURACIÓN DE LOS MATERIALES ---
        const floorMaterialScaled = new THREE.MeshStandardMaterial({ 
            map: floorTextures.diffuse, 
            bumpMap: floorTextures.bump,
            bumpScale: 0.02,
            roughness: 0.42, 
            metalness: 0.05
        });
        floorTextures.diffuse.repeat.set(5, 4);
        floorTextures.bump.repeat.set(5, 4);

        // Material del techo con la textura externa proporcionada
        const ceilingMaterial = new THREE.MeshStandardMaterial({ 
            map: ceilingTex,
            roughness: 0.8
        });

        const cabinetMaterial = new THREE.MeshStandardMaterial({ map: cabinetTex, roughness: 0.6 });
        const wallMatSides = new THREE.MeshStandardMaterial({ map: wallTexSides, roughness: 0.8 });
        const wallMatFB = new THREE.MeshStandardMaterial({ map: wallTexFB, roughness: 0.8 });

        // --- ESTRUCTURA DE LA HABITACIÓN ---
        const ROOM_HEIGHT = 3.6;
        const roomGroup = new THREE.Group();

        // Suelo
        const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 7.2), floorMaterialScaled);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = 0;
        floorMesh.receiveShadow = true;
        roomGroup.add(floorMesh);

        // Techo
        const ceilingMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 7.2), ceilingMaterial);
        ceilingMesh.rotation.x = Math.PI / 2;
        ceilingMesh.position.y = ROOM_HEIGHT;
        roomGroup.add(ceilingMesh);

        // Pared Trasera (Z = -3.6)
        const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(10, ROOM_HEIGHT), wallMatSides);
        wallBack.position.set(0, ROOM_HEIGHT / 2, -3.6);
        wallBack.receiveShadow = true;
        roomGroup.add(wallBack);

        // Pared Frontal (Z = 3.6)
        const wallFront = new THREE.Mesh(new THREE.PlaneGeometry(10, ROOM_HEIGHT), wallMatSides);
        wallFront.rotation.y = Math.PI;
        wallFront.position.set(0, ROOM_HEIGHT / 2, 3.6);
        roomGroup.add(wallFront);

        // Pared Izquierda dividida (X = -5)
        const wallLeftPart1 = new THREE.Mesh(new THREE.PlaneGeometry(4.9, ROOM_HEIGHT), wallMatFB);
        wallLeftPart1.rotation.y = Math.PI / 2;
        wallLeftPart1.position.set(-5, ROOM_HEIGHT / 2, -1.15);
        wallLeftPart1.receiveShadow = true;
        roomGroup.add(wallLeftPart1);

        const wallLeftPart2 = new THREE.Mesh(new THREE.PlaneGeometry(1.3, ROOM_HEIGHT), wallMatFB);
        wallLeftPart2.rotation.y = Math.PI / 2;
        wallLeftPart2.position.set(-5, ROOM_HEIGHT / 2, 2.95);
        wallLeftPart2.receiveShadow = true;
        roomGroup.add(wallLeftPart2);

        const wallLeftTop = new THREE.Mesh(new THREE.PlaneGeometry(1.0, ROOM_HEIGHT - 2.05), wallMatFB);
        wallLeftTop.rotation.y = Math.PI / 2;
        wallLeftTop.position.set(-5, 2.05 + (ROOM_HEIGHT - 2.05) / 2, 1.8);
        wallLeftTop.receiveShadow = true;
        roomGroup.add(wallLeftTop);

        // Pared Derecha (X = 5)
        const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(7.2, ROOM_HEIGHT), wallMatFB);
        wallRight.rotation.y = -Math.PI / 2;
        wallRight.position.set(5, ROOM_HEIGHT / 2, 0);
        wallRight.receiveShadow = true;
        roomGroup.add(wallRight);

        // Alfombra removida

        scene.add(roomGroup);

        // --- MOBILIARIO Y OBJETOS ---

        // Puerta de la Pared Izquierda
        const doorFrameGroup = new THREE.Group();
        doorFrameGroup.position.set(-4.95, 0, 1.8);
        doorFrameGroup.rotation.y = Math.PI / 2;

        const doorPlinth = new THREE.Mesh(
            new THREE.BoxGeometry(1.22, 0.03, 0.28),
            new THREE.MeshStandardMaterial({ color: 0xb5a794 })
        );
        doorPlinth.position.set(0, 0.015, 0.15);
        doorFrameGroup.add(doorPlinth);

        const frameColor = new THREE.MeshStandardMaterial({ color: 0xdbd3c5 });
        const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.045, 2.05, 0.06), frameColor);
        frameL.position.set(-0.55, 1.025, 0);
        const frameR = new THREE.Mesh(new THREE.BoxGeometry(0.045, 2.05, 0.06), frameColor);
        frameR.position.set(0.55, 1.025, 0);
        const frameT = new THREE.Mesh(new THREE.BoxGeometry(1.145, 0.045, 0.06), frameColor);
        frameT.position.set(0, 2.05, 0);
        doorFrameGroup.add(frameL, frameR, frameT);

        const doorHinge = new THREE.Group();
        doorHinge.position.set(-0.55, 0, 0);
        doorFrameGroup.add(doorHinge);

        const doorBase = new THREE.Mesh(
            new THREE.BoxGeometry(1.01, 2.01, 0.035),
            new THREE.MeshStandardMaterial({ color: 0xe0e0e0 })
        );
        doorBase.position.set(0.55, 1.005, -0.01);
        doorHinge.add(doorBase);

        const panelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const panelGeo = new THREE.BoxGeometry(0.34, 0.38, 0.01);
        const panels = [
            { x: -0.21 + 0.55, y: 1.52 }, { x: 0.21 + 0.55, y: 1.52 },
            { x: -0.21 + 0.55, y: 0.52 }, { x: 0.21 + 0.55, y: 0.52 }
        ];
        panels.forEach(p => {
            const pan = new THREE.Mesh(panelGeo, panelMat);
            pan.position.set(p.x, p.y, 0.012);
            doorHinge.add(pan);
        });

        const handleMat = new THREE.MeshStandardMaterial({ color: 0xc49d43, roughness: 0.2, metalness: 0.8 });
        const handleKnob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), handleMat);
        handleKnob.position.set(0.38 + 0.55, 0.95, 0.035);
        const handleBase = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.03, 8), handleMat);
        handleBase.rotation.x = Math.PI / 2;
        handleBase.position.set(0.38 + 0.55, 0.95, 0.015);
        doorHinge.add(handleKnob, handleBase);

        scene.add(doorFrameGroup);

        // --- SALA DE ESTAR (LIVING ROOM) ---
        const livingRoomGroup = new THREE.Group();
        const lrWallMat = new THREE.MeshStandardMaterial({color: 0x080a11, roughness: 0.95}); 
        
        // Suelo oscuro espectacular
        const lrFloorMat = new THREE.MeshStandardMaterial({
            map: floorTextures.diffuse, 
            bumpMap: floorTextures.bump,
            bumpScale: 0.03,
            roughness: 0.6, 
            color: 0x3d3028
        });

        const lrFloor = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), lrFloorMat);
        lrFloor.rotation.x = -Math.PI / 2;
        lrFloor.position.set(-9, 0, 1.0);
        lrFloor.receiveShadow = true;
        livingRoomGroup.add(lrFloor);

        const lrCeil = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), lrWallMat);
        lrCeil.rotation.x = Math.PI / 2;
        lrCeil.position.set(-9, ROOM_HEIGHT, 1.0);
        livingRoomGroup.add(lrCeil);

        // Paredes Sala
        const lrBack = new THREE.Mesh(new THREE.PlaneGeometry(10, ROOM_HEIGHT), lrWallMat);
        lrBack.rotation.y = Math.PI / 2;
        lrBack.position.set(-13, ROOM_HEIGHT / 2, 1.0);
        lrBack.receiveShadow = true; livingRoomGroup.add(lrBack);

        const lrLeftD = new THREE.Mesh(new THREE.PlaneGeometry(5.3, ROOM_HEIGHT), lrWallMat); 
        lrLeftD.rotation.y = -Math.PI / 2;
        lrLeftD.position.set(-5.01, ROOM_HEIGHT / 2, -1.35); 
        lrLeftD.receiveShadow = true; livingRoomGroup.add(lrLeftD);

        const lrRightD = new THREE.Mesh(new THREE.PlaneGeometry(3.7, ROOM_HEIGHT), lrWallMat); 
        lrRightD.rotation.y = -Math.PI / 2;
        lrRightD.position.set(-5.01, ROOM_HEIGHT / 2, 4.15); 
        lrRightD.receiveShadow = true; livingRoomGroup.add(lrRightD);

        const lrTopD = new THREE.Mesh(new THREE.PlaneGeometry(1.0, ROOM_HEIGHT - 2.05), lrWallMat);
        lrTopD.rotation.y = -Math.PI / 2;
        lrTopD.position.set(-5.01, 2.05 + (ROOM_HEIGHT - 2.05) / 2, 1.8);
        lrTopD.receiveShadow = true; livingRoomGroup.add(lrTopD);

        const lrSide1 = new THREE.Mesh(new THREE.PlaneGeometry(8, ROOM_HEIGHT), lrWallMat);
        lrSide1.position.set(-9, ROOM_HEIGHT / 2, -4);
        lrSide1.receiveShadow = true; livingRoomGroup.add(lrSide1);

        const lrSide2 = new THREE.Mesh(new THREE.PlaneGeometry(8, ROOM_HEIGHT), lrWallMat);
        lrSide2.rotation.y = Math.PI;
        lrSide2.position.set(-9, ROOM_HEIGHT / 2, 6);
        lrSide2.receiveShadow = true; livingRoomGroup.add(lrSide2);

        // Muebles: Sofá de Cuero
        const couchDarkMat = new THREE.MeshStandardMaterial({color: 0x14100c, roughness: 0.5, metalness: 0.1});
        const cBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.4, 1.1), couchDarkMat);
        cBase.position.set(-10, 0.2, 1.8);
        cBase.castShadow = true; cBase.receiveShadow = true;
        livingRoomGroup.add(cBase);

        const cBack = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.7, 0.35), couchDarkMat);
        cBack.position.set(-10, 0.55, 1.25);
        cBack.castShadow = true; cBack.receiveShadow = true;
        livingRoomGroup.add(cBack);

        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 1.1), couchDarkMat);
        armL.position.set(-11.25, 0.5, 1.8); 
        armL.castShadow = true; armL.receiveShadow = true; livingRoomGroup.add(armL);

        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 1.1), couchDarkMat);
        armR.position.set(-8.75, 0.5, 1.8); 
        armR.castShadow = true; armR.receiveShadow = true; livingRoomGroup.add(armR);

        // Muebles: Mesa de Centro de Vidrio y Metal

        const handleDoorToggle = (e) => {
            if (e) {
                e.stopPropagation();
                if (e.type === 'touchstart') e.preventDefault();
            }
            doorIsOpen = !doorIsOpen;
            doorTargetAngle = doorIsOpen ? Math.PI / 1.7 : 0;

        };

            if (isPointerLocked) return; // En PC, el mousedown de window lo maneja

        });
        
        doorPromptEl.addEventListener('touchstart', handleDoorToggle, { passive: false });

                const intersects = raycaster.intersectObject(doorHinge, true);
                if (intersects.length > 0 && intersects[0].distance < 3.0) {
                    handleDoorToggle(null);
                }
            }
        });

            });
            flashBtn.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                e.preventDefault();
                if (typeof flashlight !== 'undefined') {
                    flashlight.visible = !flashlight.visible;
                }
            }, { passive: false });
        }

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;

            const mx = e.movementX || e.mozMovementX || 0;
            const my = e.movementY || e.mozMovementY || 0;

            yaw -= mx * 0.0026;
            pitch -= my * 0.0026;

            pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
        });


        // --- CONTROLES TÁCTILES MÓVILES ---

        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const maxDist = 45;

        const mobDir = { x: 0, y: 0 };

        joystickContainer.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const touch = e.touches[0];
            joystickStart = { x: touch.clientX, y: touch.clientY };
            joystickKnob.style.transition = 'none';
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;

            let touch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth / 2) {
                    touch = e.touches[i];
                    break;
                }
            }

            if (!touch) return;

            let dx = touch.clientX - joystickStart.x;
            let dy = touch.clientY - joystickStart.y;
            const d = Math.sqrt(dx * dx + dy * dy);

            if (d > maxDist) {
                dx = (dx / d) * maxDist;
                dy = (dy / d) * maxDist;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            mobDir.x = dx / maxDist;
            mobDir.y = dy / maxDist;
        }, { passive: false });

        function resetStick() {
            joystickActive = false;
            joystickKnob.style.transition = 'transform 0.15s ease-out';
            joystickKnob.style.transform = 'translate(0px, 0px)';
            mobDir.x = 0;
            mobDir.y = 0;
        }

        window.addEventListener('touchend', (e) => {
            let leftTouch = false;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth / 2) {
                    leftTouch = true;
                }
            }
            if (!leftTouch) resetStick();
        }, { passive: true });


        const touchCameraArea = document.getElementById('touch-camera-area');
        let touchCamActive = false;
        let lastCamTouch = { x: 0, y: 0 };

        touchCameraArea.addEventListener('touchstart', (e) => {
            touchCamActive = true;
            let touch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX >= window.innerWidth / 2) {
                    touch = e.touches[i];
                    break;
                }
            }
            if (touch) {
                lastCamTouch = { x: touch.clientX, y: touch.clientY };
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchCamActive) return;

            let touch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX >= window.innerWidth / 2) {
                    touch = e.touches[i];
                    break;
                }
            }

            if (!touch) return;

            const dx = touch.clientX - lastCamTouch.x;
            const dy = touch.clientY - lastCamTouch.y;

            yaw -= dx * 0.005;
            pitch -= dy * 0.005;
            pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));

            lastCamTouch = { x: touch.clientX, y: touch.clientY };
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            let rightTouch = false;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX >= window.innerWidth / 2) {
                    rightTouch = true;
                }
            }
            if (!rightTouch) touchCamActive = false;
        }, { passive: true });


        // --- CICLO DE ANIMACIÓN Y FÍSICA ---

        const clock = new THREE.Clock();
        const moveSpeed = 3.2;

        function tick() {
            requestAnimationFrame(tick);

            const delta = Math.min(clock.getDelta(), 0.1);

            const front = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            const moveDir = new THREE.Vector3();

            if (isMobile) {
                moveDir.addScaledVector(front, -mobDir.y);
                moveDir.addScaledVector(right, mobDir.x);
            } else {
                if (keys.w) moveDir.add(front);
                if (keys.s) moveDir.addScaledVector(front, -1);
                if (keys.d) moveDir.add(right);
                if (keys.a) moveDir.addScaledVector(right, -1);
            }

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();
                camera.position.addScaledVector(moveDir, moveSpeed * delta);
            }

            if (typeof updateTV !== 'undefined') updateTV(clock.elapsedTime);

            if (typeof doorCurrentAngle !== 'undefined') {
                doorCurrentAngle += (doorTargetAngle - doorCurrentAngle) * 6 * delta;
                doorHinge.rotation.y = doorCurrentAngle;
            }

            if (typeof doorHinge !== 'undefined' && typeof doorPromptEl !== 'undefined') {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObject(doorHinge, true);
                if (intersects.length > 0 && intersects[0].distance < 3.0) {
                    if (!doorPromptVisible) {
                        doorPromptEl.style.display = 'flex';
                        doorPromptVisible = true;
                    }
                    doorPromptEl.innerHTML = doorIsOpen ? '<span>✋</span> Cerrar' : '<span>✋</span> Abrir';
                } else {
                    if (doorPromptVisible) {
                        doorPromptEl.style.display = 'none';
                        doorPromptVisible = false;
                    }
                }
            }

            if (typeof propsPhysics !== 'undefined') {
                for (let p of propsPhysics) {
                    p.userData.velocity.y += -15.8 * delta; // Gravedad rápida
                    p.position.addScaledVector(p.userData.velocity, delta);
                    
                    if (p.position.y <= 0.15) {
                        p.position.y = 0.15;
                        p.userData.velocity.y *= -0.3; // Rebote
                        p.userData.velocity.x *= 0.85; // Fricción
                        p.userData.velocity.z *= 0.85;
                    }
                    
                    // Colisión con el jugador (Empujón)
                    let dist = p.position.distanceTo(camera.position);
                    if (dist < 1.1 && p.position.y < 1.0) {
                        let push = p.position.clone().sub(camera.position).normalize();
                        push.y = 0.3;
                        p.userData.velocity.add(push.multiplyScalar(8.0 * delta));
                    }
                }
            }

            let px = camera.position.x;
            let pz = camera.position.z;
            let inDoorZ = (pz > 1.3 && pz < 2.3);

            if (px > -4.5) {
                camera.position.x = Math.max(-4.5, Math.min(4.5, px));
                camera.position.z = Math.max(-3.2, Math.min(3.2, pz));
            } else if (px < -5.0) {
                camera.position.x = Math.max(-12.0, Math.min(-5.0, px));
                camera.position.z = Math.max(-3.5, Math.min(5.5, pz));
            } else {
                if (doorIsOpen && inDoorZ) {
                    camera.position.z = Math.max(1.35, Math.min(2.25, pz));
                } else {
                    camera.position.x = (px > -4.75) ? -4.5 : -5.0;
                }
            }
            camera.position.y = 1.45; // Altura fija de ojos

            // Orientación de la cámara
            const lookTarget = new THREE.Vector3(0, 0, -1);
            lookTarget.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            lookTarget.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            lookTarget.add(camera.position);
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        window.onload = function() {
            clock.getDelta();
            tick();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
